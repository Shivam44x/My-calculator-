<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calc — My Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d1f29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --body-bg: #14151c;
    --case: #1d1f29;
    --case-edge: #262838;
    --screen: #0d0e14;
    --amber: #ffb454;
    --amber-dim: rgba(255,180,84,0.35);
    --teal: #5fd6c4;
    --key-num: #262838;
    --key-num-hi: #2f3244;
    --key-fn: #313349;
    --key-op: #3a2a2f;
    --op-text: #ff9b7a;
    --off-white: #e9e7e2;
    --muted: #7d8096;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(circle at 20% 0%, #1a1c26 0%, var(--body-bg) 55%),
      var(--body-bg);
    font-family: 'Manrope', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }

  .calc{
    width: 320px;
    max-width: 100%;
    background: linear-gradient(160deg, var(--case-edge), var(--case) 40%);
    border-radius: 28px;
    padding: 18px 16px 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 -2px 0 rgba(0,0,0,0.4);
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 4px 6px 12px;
  }
  .brand-name{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .brand-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
    display:inline-block;
    margin-right:6px;
  }

  .screen{
    background: linear-gradient(180deg, var(--screen), #101119);
    border-radius: 18px;
    padding: 22px 18px 16px;
    margin-bottom: 16px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.6), inset 0 0 0 1px #05050a;
    position: relative;
    overflow: hidden;
  }
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .history{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    text-align: right;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result{
    font-family:'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 44px;
    color: var(--amber);
    text-align: right;
    text-shadow: 0 0 18px var(--amber-dim);
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.08s ease;
  }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    border:none;
    outline:none;
    font-family:'JetBrains Mono', monospace;
    font-size: 19px;
    font-weight: 600;
    color: var(--off-white);
    background: var(--key-num);
    border-radius: 14px;
    height: 58px;
    cursor: pointer;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }
  button:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .num:hover{ background: var(--key-num-hi); }

  .fn{ background: var(--key-fn); color: var(--teal); font-size:17px; }
  .op{ background: var(--key-op); color: var(--op-text); font-size: 22px; }
  .zero{ grid-column: span 2; }
  .equals{
    background: linear-gradient(160deg, #ff9b5c, #ff7a45);
    color: #1a1206;
    font-size: 22px;
    box-shadow: 0 3px 0 #b5501f, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .equals:active{ box-shadow: 0 0 0 #b5501f; }
</style>
</head>
<body>

<div class="calc">
  <div class="brand"><span><span class="brand-dot"></span><span class="brand-name">My Calc</span></span><span class="brand-name" id="modeLabel">DEG</span></div>

  <div class="screen">
    <div class="history" id="history">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="pad">
    <button class="fn" onclick="clearAll()">AC</button>
    <button class="fn" onclick="toggleSign()">±</button>
    <button class="fn" onclick="percent()">%</button>
    <button class="op" onclick="chooseOp('÷')">÷</button>

    <button class="num" onclick="inputDigit('7')">7</button>
    <button class="num" onclick="inputDigit('8')">8</button>
    <button class="num" onclick="inputDigit('9')">9</button>
    <button class="op" onclick="chooseOp('×')">×</button>

    <button class="num" onclick="inputDigit('4')">4</button>
    <button class="num" onclick="inputDigit('5')">5</button>
    <button class="num" onclick="inputDigit('6')">6</button>
    <button class="op" onclick="chooseOp('−')">−</button>

    <button class="num" onclick="inputDigit('1')">1</button>
    <button class="num" onclick="inputDigit('2')">2</button>
    <button class="num" onclick="inputDigit('3')">3</button>
    <button class="op" onclick="chooseOp('+')">+</button>

    <button class="num zero" onclick="inputDigit('0')">0</button>
    <button class="num" onclick="inputDot()">.</button>
    <button class="equals" onclick="equals()">=</button>
  </div>
</div>

<script>
let current = "0";
let previous = null;
let operator = null;
let justEvaluated = false;

const resultEl = document.getElementById('result');
const historyEl = document.getElementById('history');

function updateScreen(){
  resultEl.textContent = formatNum(current);
  historyEl.textContent = previous !== null && operator
    ? `${formatNum(previous)} ${operator}`
    : '\u00A0';
}

function formatNum(numStr){
  if (numStr === "Error") return numStr;
  let n = parseFloat(numStr);
  if (Number.isNaN(n)) return "0";
  let s = numStr;
  if (s.length > 12) {
    n = parseFloat(n.toPrecision(10));
    s = n.toString();
  }
  return s;
}

function inputDigit(d){
  if (justEvaluated){ current = "0"; justEvaluated = false; }
  if (current === "0") current = d;
  else current += d;
  updateScreen();
}

function inputDot(){
  if (justEvaluated){ current = "0"; justEvaluated = false; }
  if (!current.includes(".")) current += ".";
  updateScreen();
}

function clearAll(){
  current = "0"; previous = null; operator = null; justEvaluated = false;
  updateScreen();
}

function toggleSign(){
  if (current !== "0") current = current.startsWith("-") ? current.slice(1) : "-" + current;
  updateScreen();
}

function percent(){
  current = (parseFloat(current) / 100).toString();
  updateScreen();
}

function chooseOp(op){
  if (operator && !justEvaluated) equals();
  previous = current;
  operator = op;
  justEvaluated = false;
  current = "0";
  updateScreen();
}

function equals(){
  if (operator === null || previous === null) return;
  const a = parseFloat(previous);
  const b = parseFloat(current);
  let r;
  switch(operator){
    case '+': r = a + b; break;
    case '−': r = a - b; break;
    case '×': r = a * b; break;
    case '÷': r = b === 0 ? NaN : a / b; break;
    default: return;
  }
  current = Number.isNaN(r) ? "Error" : r.toString();
  previous = null;
  operator = null;
  justEvaluated = true;
  updateScreen();
}

document.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
  else if (e.key === '.') inputDot();
  else if (e.key === '+') chooseOp('+');
  else if (e.key === '-') chooseOp('−');
  else if (e.key === '*') chooseOp('×');
  else if (e.key === '/') chooseOp('÷');
  else if (e.key === 'Enter' || e.key === '=') equals();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '%') percent();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
